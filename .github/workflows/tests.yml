name: studio-v3-gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

jobs:
  verify:
    name: verify / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up locked Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
          cache: pip
          cache-dependency-path: tools/studio_v3_verify/python-ci.lock

      - name: Install locked Python environment
        run: >-
          python -m pip install
          --requirement tools/studio_v3_verify/python-ci.lock

      - name: Build and install the dlstudio wheel
        run: >-
          python -m pip install
          --no-deps
          --no-build-isolation
          common/dlstudio

      - name: Smoke-test the installed wheel
        run: python tools/studio_v3_installed_smoke.py

      - name: Set up locked Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: common/dlstudio/webui/package-lock.json

      - name: Install locked Web UI environment
        working-directory: common/dlstudio/webui
        run: npm ci

      - name: Verify FFmpeg is available
        run: ffmpeg -version

      - name: Run architecture, performance, generated-client, and full v3 gates
        run: python -m tools.studio_v3_verify --profile cutover --scope full
