[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dlstudio"
version = "3.0.0"
description = "Studio v3 modular video-production application"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dl2 = "dlstudio.adapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dlstudio.adapters" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "canonical_vector: cross-platform canonical serialization vector",
    "performance_smoke: behavioral performance regression contract",
    "reference_performance: frozen reference-machine measurement budget",
]
